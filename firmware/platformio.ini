; Flight computer firmware -- PlatformIO project.
;
; Framework: Arduino only (not the "espidf, arduino" dual-component mix).
; As of arduino-esp32 3.x, the Arduino core itself is built ON TOP OF
; ESP-IDF 5.x -- so `framework = arduino` already gives FreeRTOS (xTaskCreate,
; xQueueCreate, ...), the full ESP-IDF API surface (esp_partition, esp_timer,
; nvs_flash, ...) *and* the entire Arduino library ecosystem (lib_deps below)
; in one project, without hand-wrapping every Arduino library as a separate
; ESP-IDF component. This matches what we want: FreeRTOS/ESP-IDF as the
; underlying OS, Arduino as the library-access layer on top.
;
; Platform: pioarduino's fork of platform-espressif32 (tracks current
; arduino-esp32 3.x releases faster than the official PlatformIO registry
; package). "stable" is a moving tag pioarduino maintains -- see
; https://github.com/pioarduino/platform-espressif32/releases.
;
; core/ (the portable filter/state-machine library, see ../core) is pulled
; in via symlink so there is exactly one copy of it, shared with the host
; tests and sim/ -- see ../docs/ARCHITECTURE.md.

[env:esp32-s3-fh4r2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; --- Flash/PSRAM: ESP32-S3-FH4R2 = 4MB flash, 2MB Quad-SPI PSRAM ---
; TODO verify: esp32-s3-devkitc-1 is the closest stock board definition
; (usually 8MB/N8R8); flash size and PSRAM bus width are overridden below
; for the FH4R2's actual 4MB quad-flash + 2MB quad-PSRAM. "qio_qspi" =
; quad I/O flash + quad SPI PSRAM; double check against arduino-esp32's
; current board_build.arduino.memory_type option names if the build fails.
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_build.psram_type = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    symlink://../core
    adafruit/Adafruit LSM9DS1 Library@^2.2.3
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit BMP280 Library@^2.6.8
    mikalhart/TinyGPSPlus@^1.1.0
